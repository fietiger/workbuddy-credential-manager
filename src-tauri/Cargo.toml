[package]
name = "workbuddy-credential-manager"
version = "0.1.0"
edition = "2021"
description = "Local-only WorkBuddy credential manager. No proxy, no relay."
license = "MIT"
rust-version = "1.77"

[lib]
name = "workbuddy_credential_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
dirs = "5"
thiserror = "2"
tauri-plugin-dialog = "2"

[features]
default = []

[profile.release]
strip = true
lto = true
